site_name: osTicket Reforged — Engenharia Reversa
site_description: Inventário e análise verificável da baseline osTicket v1.18.4
site_author: osTicket Reforged
repo_url: https://github.com/albertomoreiraluiz/osTicketReforged
repo_name: albertomoreiraluiz/osTicketReforged
edit_uri: ""
docs_dir: docs
site_dir: .local/site-docs
strict: true

theme:
  name: material
  language: pt-BR
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-night
        name: Usar tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Usar tema claro
  features:
      - navigation.indexes
      - navigation.tabs
      - navigation.tabs.sticky
      - navigation.tracking
      - navigation.top
      - navigation.footer
      - toc.follow
      - content.code.copy
      - search.highlight
      - search.share
      - search.suggest

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search:
      lang:
        - pt
        - en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Início: index.md
  - Projeto:
      - Contexto persistente: governance/PROJECT_CONTEXT.md
      - Checkpoint de retomada: governance/CURRENT_STATE.md
      - Progresso atual: governance/PROGRESS.md
      - Plano ativo: plans/active/0001-reverse-engineering.md
      - Decisões de governança: governance/DECISIONS.md
      - Política documental: governance/DOCUMENTATION_POLICY.md
      - Registro de mudanças: changes/README.md
  - Engenharia reversa:
      - Visão geral: reverse-engineering/index.md
      - Inventário e rastreabilidade:
          - Inventário da baseline: reverse-engineering/INVENTORY.md
          - Cobertura do código-fonte: reverse-engineering/SOURCE_COVERAGE_MATRIX.md
          - Proveniência e ownership: reverse-engineering/PROVENANCE_MAP.md
          - Ondas de inventário: reverse-engineering/WAVE_MANIFEST.md
          - Matriz de evidências: reverse-engineering/EVIDENCE_MATRIX.md
          - Revisões independentes: reverse-engineering/REVIEW_REPORT.md
          - Revisões do Portão D: reverse-engineering/GATE_D_REVIEW.md
      - Arquitetura e execução:
          - Arquitetura canônica: reverse-engineering/ARCHITECTURE.md
          - Reforged — Módulos lógicos: reverse-engineering/MODULE_CAPABILITY_PROPOSAL.md
          - Reforged — Integração e contratos: reverse-engineering/INTEGRATION_CONTRACT_DESIGN.md
          - Portão D — Reinício e histórico: reverse-engineering/ARCHITECTURE_DECISION_RECORD.md
          - Portão D — Estratégia descartada: reverse-engineering/MIGRATION_STRATEGY.md
          - Mapa de componentes: reverse-engineering/COMPONENT_MAP.md
          - Catálogo de entrypoints: reverse-engineering/ENTRYPOINT_CATALOG.md
          - Ciclo de requisição: reverse-engineering/REQUEST_LIFECYCLE.md
          - Superfícies HTTP: reverse-engineering/HTTP_SURFACES.md
          - Subsistemas transversais: reverse-engineering/TRANSVERSAL_SUBSYSTEMS.md
      - Domínio e persistência:
          - Ciclo do ticket: reverse-engineering/TICKET_LIFECYCLE.md
          - Modelo de dados: reverse-engineering/DATA_MODEL_MAP.md
          - Banco e persistência: reverse-engineering/DATABASE.md
          - Arquitetura de persistência: reverse-engineering/DATABASE_ARCHITECTURE.md
          - Catálogo ORM: reverse-engineering/ORM_CATALOG.md
          - Instalação e upgrades: reverse-engineering/INSTALLATION_UPGRADE.md
          - Falhas, atomicidade e órfãos: reverse-engineering/INTEGRITY_FAILURES.md
      - Interfaces e comportamento:
          - Frontend PHP existente: reverse-engineering/FRONTEND_ANALYSIS.md
          - Reforged — Direção de UX: plans/active/0002-functional-ux-direction.md
          - Análise comportamental: reverse-engineering/BEHAVIORAL_ANALYSIS.md
          - Cobertura integral da interface: reverse-engineering/INTERFACE_COVERAGE_MATRIX.md
          - Protocolo de observação: reverse-engineering/INTERFACE_OBSERVATION_PROTOCOL.md
          - Modelo operacional do Wiki: reverse-engineering/OSTICKET_OPERATIONAL_MODEL.md
          - Testes da baseline: reverse-engineering/TESTING_BASELINE.md
      - APIs e automação:
          - Fluxos SCP para módulos:
              - Mapa e cobertura: reverse-engineering/SCP_FLOW_MAP.md
              - Operação: reverse-engineering/SCP_OPERATIONAL_FLOWS.md
              - Administração: reverse-engineering/SCP_ADMIN_FLOWS.md
              - Serviços transversais: reverse-engineering/SCP_TRANSVERSAL_FLOWS.md
          - APIs, AJAX e integrações: reverse-engineering/API_ANALYSIS.md
          - Catálogo de rotas AJAX: reverse-engineering/AJAX_ROUTE_CATALOG.md
          - Catálogo dos módulos CLI: reverse-engineering/CLI_CATALOG.md
      - Segurança e acesso:
          - Modelo de segurança: reverse-engineering/SECURITY_MODEL.md
          - Autenticação e autorização: reverse-engineering/AUTHENTICATION.md
      - Extensibilidade e customização:
          - Pontos de extensão: reverse-engineering/EXTENSION_POINTS.md
          - Arquitetura de plugins: reverse-engineering/PLUGIN_ARCHITECTURE.md
          - Registries e factories: reverse-engineering/REGISTRY_CATALOG.md
          - Visão geral dos sinais: reverse-engineering/HOOKS.md
          - Catálogo de sinais: reverse-engineering/SIGNAL_CATALOG.md
          - Matriz de customização: reverse-engineering/CUSTOMIZATION_MATRIX.md
      - Evidências comportamentais:
          - Protocolo e índice: reverse-engineering/evidence/README.md
          - Auditoria complementar da Onda 9: reverse-engineering/evidence/WAVE-09-CLOSURE-AUDIT.md
          - BHV-027 — tickets vinculados: reverse-engineering/evidence/BHV-027-linked-tickets.md
          - BHV-029 — ticket de resposta: reverse-engineering/evidence/BHV-029-ticket-from-response.md
  - Decisões arquiteturais:
      - Como as decisões são registradas: adr/README.md
      - ADR 0001 — Frontend separado: adr/0001-frontend-angular-primeng.md
      - ADR 0002 — Portal documental: adr/0002-documentation-toolchain.md
      - ADR 0003 — Coexistência e portal: adr/0003-coexistencia-paineis-portal-separado.md
      - ADR 0004 — Módulos e backend original: adr/0004-modulos-reforged-backend-osticket.md
      - ADR 0005 — Módulos e paridade SCP: adr/0005-modulos-logicos-paridade-scp.md
  - Ambiente e ferramentas:
      - Portal documental: development/DOCUMENTATION_PORTAL.md
      - Homologação: development/HOMOLOGATION_ENVIRONMENT.md
  - Referência oficial incorporada: upstream/osticket-docs/README.md
